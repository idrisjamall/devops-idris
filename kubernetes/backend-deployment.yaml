apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: idris
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: backend
        image: ghcr.io/idrisjamall/devops-idris/backend:b7722cd78b7c389ce84a02f83c36948ff4657631
        imagePullPolicy: Always
        env: 
          - name: MONGODB_URI
            value: "mongodb://praxis-form-mongodb.praxis.svc.cluster.local:27017/idris-praxis"
          - name: JWT_EXP_MINUTES
            value: "120"      
          - name: ADMIN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-secrets
                key: ADMIN_DEFAULT_PASSWORD
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: backend-secrets
                key: JWT_SECRET
        ports:
        - containerPort: 8080
      
    

