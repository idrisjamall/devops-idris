apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: idris
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: frontend
        image: ghcr.io/idrisjamall/devops-idris/frontend:b17d9b545b424cd7e4096e4b42dbd41660daf503

        imagePullPolicy: Always
        env:
          - name: API_URL
            value: "https://jamal-kubernetes.infra-x.cloud"  
       
        ports:
        - containerPort: 80
