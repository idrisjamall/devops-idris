apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: praxis-form-idris
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/idrisjamall/devops-idris.git
    targetRevision: main
    path: idris-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: idris
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
