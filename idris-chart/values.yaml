namespace: idris
backend:
  replicas: 1
  image:
    repository: ghcr.io/idrisjamall/devops-idris/backend
    tag: latest
    
imagepullsecrets: ghcr-pull-secret

frontend:
  replicas: 1
  image:
    repository: ghcr.io/idrisjamall/devops-idris/frontend
    tag: latest

grafana:
  enabled: true
 
  ingress:
    enabled: true
    ingressClassName: nginx
    
    path: /
    pathType: Prefix

    hosts:
      - jamal-grafana.infra-x.cloud
  


    tls:
    - secretName: idris-grafana-tls
      hosts:
        - jamal-grafana.infra-x.cloud
  