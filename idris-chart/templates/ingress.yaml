apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: idris-ingress
  namespace: idris
spec:
  ingressClassName: nginx
  rules:
  - host:  jamal-kubernetes.infra-x.cloud 
    http:
      paths:
      - backend:
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: backend-service
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: backend-service
            port:
              number: 80
        path: /actuator
        pathType: Prefix
  tls:
    - secretName: idris-tls
      hosts:
        - jamal-kubernetes.infra-x.cloud
        
  

  